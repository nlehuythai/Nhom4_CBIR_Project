<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>CBIR - Image Retrieval</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 font-sans">
    <div class="flex h-screen">
        <aside class="w-64 bg-slate-900 text-white p-6 flex flex-col justify-between">
            <div>
                <h1 class="text-2xl font-bold mb-8 text-indigo-400">🖼️ CBIR System</h1>
                <nav class="space-y-3">
                    <a href="index.html" class="block py-2.5 px-4 rounded bg-indigo-600 text-white font-medium">Image
                        Retrieval</a>
                    <a href="compare.html" class="block py-2.5 px-4 rounded hover:bg-slate-800 text-gray-300">Compare
                        Methods</a>
                    <a href="evaluation.html"
                        class="block py-2.5 px-4 rounded hover:bg-slate-800 text-gray-300">Evaluation Dashboard</a>
                    <a href="gallery.html" class="block py-2.5 px-4 rounded hover:bg-slate-800 text-gray-300">Dataset
                        Gallery</a>
                </nav>
            </div>
        </aside>
        <main class="flex-1 p-8 overflow-y-auto">
            <header class="mb-8">
                <h2 class="text-3xl font-bold text-gray-800">Image Retrieval</h2>
                <p class="text-gray-500">Tìm kiếm ảnh tương tự dựa trên nội dung trực quan[cite: 30]</p>
            </header>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h3 class="text-lg font-semibold mb-4 text-gray-700">Ảnh truy vấn</h3>
                    <input type="file" id="uploadInput"
                        class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 mb-4" />
                    <div id="previewContainer" class="mb-4 hidden">
                        <img id="imagePreview" class="w-full h-48 object-cover rounded-lg border" alt="Preview">
                    </div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Thuật toán đặc trưng</label>
                    <select id="methodSelect" class="w-full p-2.5 border rounded-lg mb-4 bg-gray-50">
                        <option value="Color Histogram">Color Histogram</option>
                        <option value="Color Moments">Color Moments</option>
                        <option value="LBP">Local Binary Pattern (LBP)</option>
                    </select>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Số lượng Top-K kết quả</label>
                    <select id="topKSelect" class="w-full p-2.5 border rounded-lg mb-4 bg-gray-50">
                        <option value="6">Top 6</option>
                        <option value="10">Top 10</option>
                        <option value="20">Top 20</option>
                    </select>
                    <button onclick="handleSearch()"
                        class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-medium hover:bg-indigo-700 transition">
                        🔍 Tìm kiếm tương tự
                    </button>
                </div>
                <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h3 class="text-lg font-semibold mb-4 text-gray-700">Kết quả truy xuất (Top-K)</h3>
                    <div id="resultsGrid" class="grid grid-cols-2 md:grid-cols-3 gap-4">
                        <p class="text-gray-400 col-span-full text-center py-12">Chưa có kết quả. Vui lòng tải ảnh lên
                            và bấm tìm kiếm.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="js/main.js"></script>
</body>

</html>
